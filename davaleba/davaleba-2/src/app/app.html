<!-- Header კომპონენტი (ცალკე) -->
<app-header></app-header>

<!-- Shopping Cart View -->
<main class="min-h-[calc(100vh-200px)] bg-[#F7FAFC]">
  <div class="max-w-[1200px] mx-auto px-4 py-6">

    <!-- სათაური: My cart (რაოდენობა) -->
    <h1 class="text-xl font-bold text-[#1C1C1C] mb-5">
      My cart ({{ cartService.distinctItemCount() }})
    </h1>

    <!-- Grid Layout: პროდუქტები | შეჯამება -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-start">

      <!-- მარცხენა სვეტი: პროდუქტების სია -->
      <div class="md:col-span-8">
        <div class="bg-white rounded-md border border-[#DEE2E7]">

          <!-- პროდუქტების კონტეინერი -->
          <div *ngIf="cartService.distinctItemCount() > 0; else emptyCartTemplate">
            <app-cart-item
              *ngFor="let item of cartService.items()"
              [item]="item"
            ></app-cart-item>
          </div>

          <!-- ცარიელი კალათა -->
          <ng-template #emptyCartTemplate>
            <div class="py-16 text-center">
              <div class="w-16 h-16 mx-auto rounded-full bg-gray-100 flex items-center justify-center text-gray-400 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                </svg>
              </div>
              <h3 class="text-lg font-bold text-[#1C1C1C] mb-1">Your cart is empty</h3>
              <p class="text-sm text-[#505050] mb-4">Looks like you haven't added anything yet.</p>
              <button
                type="button"
                (click)="resetCart()"
                class="px-6 py-2.5 bg-[#0D6EFD] hover:bg-[#0B5ED7] text-white font-semibold text-sm rounded-md cursor-pointer transition-colors"
              >
                Load Demo Items
              </button>
            </div>
          </ng-template>

          <!-- ქვედა მოქმედებები -->
          <div *ngIf="cartService.distinctItemCount() > 0" class="px-4 py-4 border-t border-[#DEE2E7] flex items-center justify-between">
            <!-- Back to shop -->
            <button
              type="button"
              (click)="goToHome()"
              class="inline-flex items-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-[#0D6EFD] hover:bg-[#0B5ED7] rounded-md transition-colors cursor-pointer"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
              </svg>
              <span>Back to shop</span>
            </button>

            <!-- Remove all -->
            <button
              type="button"
              (click)="removeAll()"
              class="text-sm font-medium text-[#0D6EFD] hover:text-blue-700 transition-colors cursor-pointer border border-[#DEE2E7] rounded-md px-4 py-2.5"
            >
              Remove all
            </button>
          </div>
        </div>
      </div>

      <!-- მარჯვენა სვეტი: შეკვეთის შეჯამება და კუპონი -->
      <div class="md:col-span-4">
        <app-order-summary></app-order-summary>
      </div>

    </div>
  </div>
</main>

<!-- Toast შეტყობინება -->
<div
  *ngIf="cartService.toast() as t"
  class="fixed bottom-6 right-6 z-50 bg-[#1C1C1C] text-white px-4 py-3 rounded-lg shadow-2xl flex items-center gap-3 animate-fade-in max-w-sm"
>
  <div class="w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center shrink-0">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
    </svg>
  </div>
  <span class="text-sm font-medium">{{ t.message }}</span>
</div>
